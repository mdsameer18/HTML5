<!doctype html>
<html>
  <head>
    <title>Daily Life</title>
    <link rel="stylesheet" href="sameer.css" />
  </head>
  <body>
    <h1>My Daily Routine</h1>

    <div class="container1" id="sleep">
      <h2>Sleeping</h2>
      <img src="images\sleeping.jpg" width="200" height="200" />
      <p>Wake me up next year!</p>
      <button class="btn1">Do Not Disturb</button>
    </div>

    <div class="container2" id="food">
      <h2>Eating</h2>
      <img src="images\food.jpg" width="200" height="200" />
      <p style="color: rgb(0, 0, 0)">Diet starts tomorrow!</p>
      <button class="btn2">Biryani Please</button>
    </div>

    <div class="container3" id="gaming">
      <h2>Gaming</h2>
      <img src="images\gaming.jpg" width="200" height="200" />
      <p style="color: rgb(255, 0, 0)">One last match bro!</p>
      <button class="btn3">Play Again</button>
    </div>

    <div class="container4" id="study">
      <h2>Studying</h2>
      <img src="images\studying.jpg" width="200" height="200" />
      <p style="color: blue">From tomorrow i will study!</p>
      <button class="btn4">Study Mode ON</button>
    </div>
  </body>
</html>
